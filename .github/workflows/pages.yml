name: Publiser til GitHub Pages

on:
  push:
    branches: ["claude/intelligent-keller-kgbcf5"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Konfigurer Pages (aktiverer ved første kjøring)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pakk siden
        run: |
          mkdir dist
          cp index.html dist/
          cp -r css js dist/

      - name: Last opp artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
